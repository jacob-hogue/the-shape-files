<script>
/* Load the design-system runtime relative to the site root, which differs on GitHub Pages project sites. */
(function () {
  var nav = [].slice.call(document.scripts).filter(function (x) { return /site_libs\/quarto-nav\/quarto-nav\.js/.test(x.getAttribute("src") || ""); })[0];
  var base = nav ? nav.getAttribute("src").replace(/site_libs\/quarto-nav\/quarto-nav\.js.*$/, "") : "";
  if (!document.querySelector(".sf-hero-mount")) return;
  ["react.production.min.js", "react-dom.production.min.js", "three.min.js", "shapefiles.bundle.js", "hero-mount.js"].reduce(function (p, f) {
    return p.then(function () { return new Promise(function (done) { var e = document.createElement("script"); e.src = base + "assets/js/" + f; e.onload = done; e.onerror = done; document.body.appendChild(e); }); });
  }, Promise.resolve());
})();
</script>
