project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - articles/*/index.qmd
    - lab/*/index.qmd
  resources:
    - assets/
    - lab/*/run.py
    - lab/*/figures.py
    - lab/*/results.json
    - lab/*/requirements.txt
    - lab/*/data/
    - lab/*/figures/

website:
  title: "The Shape-Files"
  description: "A living technical history of GIS and geospatial computing."
  favicon: assets/img/file-mark-light.svg
  site-url: "https://jacob-hogue.github.io/the-shape-files/"
  page-navigation: true
  announcement:
    content: "Draft site. Not for circulation: claims marked for verification are still being checked."
    type: warning
    dismissable: false
    position: below-navbar
  navbar:
    logo: assets/img/file-mark-light.svg
    logo-alt: "The Shape-Files file mark"
    title: "The Shape-Files"
    left:
      - text: "Volume 1"
        href: index.qmd#volume-1
      - text: "Lab"
        href: lab/X001-three-representations/index.qmd
      - text: "About"
        href: about.qmd
  page-footer:
    left: "The Shape-Files · draft"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css:
      - styles/tokens.css
      - styles/components.css
      - styles/site.css
    toc: true
    toc-title: "In this article"
    toc-depth: 2
    smooth-scroll: true
    link-external-newwindow: true
    citations-hover: true
    highlight-style: a11y
    include-in-header:
      - text: '<meta name="robots" content="noindex, nofollow">'
    include-after-body: _includes/scripts.html

lang: en-US
